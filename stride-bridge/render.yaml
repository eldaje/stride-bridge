services:
  - type: web
    name: stride-bridge
    runtime: node
    plan: free
    buildCommand: node --version
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PUBLIC_URL
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_SCOPES
        value: read,activity:read_all,profile:read_all
